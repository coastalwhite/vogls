[workspace]
members = [
    "crates/*",
    
    "tools/pipeline-explorer",
    "tools/trva/trva",
    "tools/trva/snapshot-tests",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
slotmap = "1"
bytemuck = "1"
proptest = "1"
hashbrown = "0.16"
foldhash = "0.2.0"
rayon = "1.12.0"
rand = "0.10"
clap = { version = "4.5", features = ["derive"] }
bumpalo = "3.20"
tempfile = "3.27.0"
pyo3 = { version = "0.28.1", features = ["abi3-py311"] }

vogls = { path = "crates/vogls", default-features = false }
vogls-frontend.path = "crates/vogls-frontend"
vogls-bytecode.path = "crates/vogls-bytecode"
vogls-ir.path = "crates/vogls-ir"
vogls-fuse-signals.path = "crates/vogls-fuse-signals"
vogls-bits.path = "crates/vogls-bits"
vogls-verilog.path = "crates/vogls-verilog"
vogls-utils.path = "crates/vogls-utils"
vogls-codegen.path = "crates/vogls-codegen"
vogls-codegen-c.path = "crates/vogls-codegen-c"
vogls-runtime.path = "crates/vogls-runtime"
vogls-vcd.path = "crates/vogls-vcd"
vogls-sdf.path = "crates/vogls-sdf"
vogls-trace.path = "crates/vogls-trace"
vogls-plan.path = "crates/vogls-plan"

pipeline-explorer.path = "tools/pipeline-explorer"
trva.path = "tools/trva/trva"

[profile.debug-release]
inherits = "release"
debug = true

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(vm_profile)'] }

[workspace.lints.clippy]
result_unit_err = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
