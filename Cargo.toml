[workspace]
members = [
    "vogls",
    "vogls-test",
    "vogls-ir",
    "vogls-sim",
    "vogls-verilog",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
slotmap = "1"
indexmap = "1"
bytemuck = "1"
clap = { version = "4.5", features = ["derive"] }

vogls.path = "vogls"
vogls-sim.path = "vogls-sim"
vogls-ir.path = "vogls-ir"
vogls-verilog.path = "vogls-verilog"

[profile.debug-release]
inherits = "release"
debug = true
