[package]
name = "pipeline-explorer"
version = "0.1.0"
edition = "2024"

[lib]
name = "pipeline_explorer"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pipeline-explorer"
path = "src/main.rs"
required-features = ["neorv32"]

[features]
default = ["js", "picorv32", "ibex", "neorv32", "hazard3"]
# The `wasm-bindgen` entry points used by the webapp's bundled wasm. Plugins
# (see `plugin/`) reuse the design code but are instantiated without any host
# glue, so they depend on this crate with the feature off.
js = ["dep:js-sys", "dep:wasm-bindgen"]
picorv32 = []
ibex = []
neorv32 = []
hazard3 = []

[dependencies]
bytemuck = "1.25.0"
js-sys = { version = "=0.3.91", optional = true }
vogls = { workspace = true }
trva = { workspace = true }
wasm-bindgen = { version = "=0.2.114", optional = true }
