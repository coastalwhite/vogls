<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipeline Visualizer</title>
  </head>
  <body>
    <main id="app">
		<div id="statsbar">
			<div class="mx-4">Cycle <a id="currentCycle">0</a> / <a id="totalCycles">0</a></div>
			<div id="pipelineStages"></div>
            <div></div>
			<!-- <button id="uploadBtn" class="mx-4">Upload <img src="/arrow-rightup.svg" /></button> -->
		</div>

		<div id="content">
			<div id="central">
				<div id="left">
                    <div class="editor">
                      <div class="editor-inner">
                        <pre aria-hidden="true"><code id="out"></code></pre>
                        <textarea id="assemblyTextarea" spellcheck="false" autocapitalize="off" autocomplete="off"
                                  aria-label="RISC-V assembly editor" onchange="staggerRunSim"></textarea>
                      </div>
                    </div>
				</div>
				<div id="pipelineContainer" />
			</div>
		</div>
		<div id="footer">
			<div id="scrubberContainer"></div>
			<div id="simControls">
				<div class="chip-menu">
					<button id="chipMenuBtn" type="button" aria-haspopup="dialog" aria-expanded="false"
					        aria-controls="chipMenuPanel">
						<span id="chipMenuName">Ibex</span>
						<span class="chip-menu-caret" aria-hidden="true">▾</span>
					</button>
					<div id="chipMenuPanel" role="dialog" aria-label="Simulation settings" hidden>
						<label class="chip-menu-row" for="procSelect">
							<span>Processor</span>
							<select id="procSelect">
								<option value="picorv32">PicoRV32</option>
								<option value="ibex">Ibex</option>
								<option value="neorv32">NeoRV32</option>
							</select>
						</label>
						<label class="chip-menu-row" for="numCyclesInput">
							<span>Cycles</span>
							<input type="number" id="numCyclesInput" />
						</label>
						<div id="procConfigDetail"></div>
					</div>
				</div>
				<div class="w-8 h-8" id="simStatus"></div>
			</div>
		</div>
	</main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
