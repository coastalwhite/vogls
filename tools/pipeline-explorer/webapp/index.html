<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipeline Visualizer</title>
  </head>
  <body>
    <main id="app">
		<div id="statsbar">
			<div class="mx-4">Cycle <a id="currentCycle">0</a> / <a id="totalCycles">0</a></div>
			<div id="pipelineStages"></div>
            <div></div>
			<!-- <button id="uploadBtn" class="mx-4">Upload <img src="/arrow-rightup.svg" /></button> -->
		</div>

		<div id="content">
			<div id="central">
				<div id="left">
                    <div class="editor">
                      <div class="editor-inner">
                        <pre aria-hidden="true"><code id="out"></code></pre>
                        <textarea id="assemblyTextarea" spellcheck="false" autocapitalize="off" autocomplete="off"
                                  aria-label="RISC-V assembly editor" onchange="staggerRunSim"></textarea>
                      </div>
                    </div>
                    <details class="proc-config">
                        <summary class="proc-config-short">
                            <div>^</div>
                            <div class ="flex-1">
                                <select id="procSelect">
                                    <option value="picorv32">PicoRV32</option>
                                    <option value="ibex">Ibex</option>
                                    <option value="neorv32">NeoRV32</option>
                                </select>
                            </div>
                            <div class ="flex-1"><input type="number" id="numCyclesInput" /></div>
                            <div class="w-8 h-8" id="simStatus"></div>
                        </summary>
                        <div id="procConfigDetail">
                        </div>
                    </details>
				</div>
				<div id="pipelineContainer" />
			</div>
		</div>
		<div id="footer">
            <button class="incdec-btn" id="prevCycle"><img src="/arrow-left.svg" /></button>
			<button class="incdec-btn" id="nextCycle"><img src="/arrow-right.svg" /></button>
			<div id="scrubberContainer" />
		</div>
	</main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
